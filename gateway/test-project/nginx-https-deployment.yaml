# ============================================================
# deployment.yaml
#
# nginx serving a single static page over HTTPS on port 8443.
# Sits behind Envoy Gateway — not exposed directly.
#
# Changes from original:
#   - Port 443 → 8443 (no root required, convention behind a gateway)
#   - server_name → ex.jtanprojects.com
#   - cert secret → ex-tls (issued in this namespace by tls.yaml)
# ============================================================
 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-https
  namespace: ex-proj
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-https
  template:
    metadata:
      labels:
        app: nginx-https
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 8443
              name: https
          volumeMounts:
            - name: certs
              mountPath: /etc/nginx/certs
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: certs
          secret:
            secretName: ex-tls              # provisioned by tls.yaml in this folder
        - name: nginx-config
          configMap:
            name: nginx-https-config
 
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-https-config
  namespace: ex-proj
data:
  default.conf: |
    server {
        listen 8443 ssl;
        server_name ex.jtanprojects.com;
 
        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
 
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
 
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-https-service
  namespace: ex-proj
spec:
  selector:
    app: nginx-https
  ports:
    - name: https              # must be named "https" for Envoy protocol inference
      port: 8443
      targetPort: 8443
