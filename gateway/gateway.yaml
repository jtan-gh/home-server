# ============================================================
# Gateway Configuration for NGINX Gateway Fabric
# 
# This Gateway supports three types of listeners:
#   1. HTTPS (Terminate) - For standard web apps (HTTP backends)
#   2. HTTP (Redirect) - Redirects to HTTPS
#   3. TLS Passthrough - For apps that manage their own certificates
#
# Re-encryption (BackendTLSPolicy) is configured per-route separately
# ============================================================
# Wildcard certificate - covers all subdomains
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-tls
  namespace: gateway-system
spec:
  secretName: wildcard-tls
  issuerRef:
    name: letsencrypt-dns
    kind: ClusterIssuer
  commonName: "*.jtanprojects.com"
  dnsNames:
    - "*.jtanprojects.com"
    - "jtanprojects.com"

---
# Gateway with multiple listeners
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nginx-gateway
  namespace: gateway-system
spec:
  gatewayClassName: nginx
  listeners:
    # ==========================================
    # Listener 1: Standard HTTPS (Termination)
    # For apps that expect HTTP internally
    # ==========================================
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.jtanprojects.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls
            namespace: gateway-system
      allowedRoutes:
        namespaces:
          from: All

    # ==========================================
    # Listener 2: TLS Passthrough
    # For apps that manage their own certificates
    # Uses TLSRoute instead of HTTPRoute
    # ==========================================
    - name: passthrough
      port: 8443                    # Using different port to avoid conflict
      protocol: TLS
      hostname: "*.jtanprojects.com"
      tls:
        mode: Passthrough           # No certificate needed
      allowedRoutes:
        namespaces:
          from: All

    # ==========================================
    # Listener 3: HTTP Redirect
    # Redirects all HTTP traffic to HTTPS
    # ==========================================
    - name: http
      port: 80
      protocol: HTTP
      hostname: "*.jtanprojects.com"
      allowedRoutes:
        namespaces:
          from: All
