---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echoserver
  namespace: gateway-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echoserver
  template:
    metadata:
      labels:
        app: echoserver
    spec:
      containers:
      - name: echoserver
        image: ealen/echo-server:latest
        ports:
        - containerPort: 80
        env:
        - name: PORT
          value: "80"
---
apiVersion: v1
kind: Service
metadata:
  name: echoserver
  namespace: gateway-system
spec:
  selector:
    app: echoserver
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: test-route
  namespace: gateway-system
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - test.jtanprojects.com
  rules:
    - backendRefs:
        - name: echoserver
          port: 80
