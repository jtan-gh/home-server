apiVersion: batch/v1
kind: Job
metadata:
  name: opencloud-init
  namespace: opencloud
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: init
          image: opencloudeu/opencloud-rolling:latest
          command:
            - sh
            - -c
            - |
              if [ -f /etc/opencloud/opencloud.yaml ]; then
                echo "Already initialized, skipping."
                exit 0
              fi
              opencloud init
          envFrom:
            - configMapRef:
                name: opencloud-config
            - secretRef:
                name: opencloud-secret
          volumeMounts:
            - name: config
              mountPath: /etc/opencloud
            - name: data
              mountPath: /var/lib/opencloud
            - name: certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: opencloud-config
        - name: data
          persistentVolumeClaim:
            claimName: opencloud-data
        - name: certs
          secret:
            secretName: opencloud-tls
            items:
              - key: tls.crt
                path: server.pem
              - key: tls.key
                path: server.key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud
  namespace: opencloud
  labels:
    app: opencloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencloud
  template:
    metadata:
      labels:
        app: opencloud
    spec:
      initContainers:
        - name: wait-for-init
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              echo "Waiting for initialization..."
              until [ -f /etc/opencloud/opencloud.yaml ]; do
                sleep 2
              done
              echo "Config found, starting server..."
          volumeMounts:
            - name: config
              mountPath: /etc/opencloud
      containers:
        - name: opencloud
          image: opencloudeu/opencloud-rolling:latest
          command: ["opencloud", "server"]
          ports:
            - containerPort: 9200
              name: https
          envFrom:
            - configMapRef:
                name: opencloud-config
            - secretRef:
                name: opencloud-secret
          volumeMounts:
            - name: config
              mountPath: /etc/opencloud
            - name: data
              mountPath: /var/lib/opencloud
            - name: certs
              mountPath: /certs
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 9200
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 9200
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: opencloud-config
        - name: data
          persistentVolumeClaim:
            claimName: opencloud-data
        - name: certs
          secret:
            secretName: opencloud-tls
            items:
              - key: tls.crt
                path: server.pem    # opencloud expects /certs/server.pem
              - key: tls.key
                path: server.key    # opencloud expects /certs/server.key

---
apiVersion: v1
kind: Service
metadata:
  name: opencloud
  namespace: opencloud
spec:
  selector:
    app: opencloud
  ports:
    - name: https
      port: 443          # internal calls hit 443
      targetPort: 9200   # pod is on 9200
    - name: https-node
      port: 9200
      targetPort: 9200
      nodePort: 32000    # Cloudflare tunnel still hits 32000
  type: NodePort
