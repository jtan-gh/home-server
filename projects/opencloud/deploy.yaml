apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud
  namespace: opencloud
  labels:
    app: opencloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencloud
  template:
    metadata:
      labels:
        app: opencloud
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000       # kubelet chowns all volume mounts to this GID on attach
      initContainers:
        - name: init
          image: opencloudeu/opencloud-rolling:latest
          command:
            - sh
            - -c
            - |
              [ -f /etc/opencloud/opencloud.yaml ] && exit 0
              opencloud init
          envFrom:
            - configMapRef:
                name: opencloud-config
            - secretRef:
                name: opencloud-secret
          volumeMounts:
            - name: config
              mountPath: /etc/opencloud
            - name: tank
              mountPath: /var/lib/opencloud
      containers:
        - name: opencloud
          image: opencloudeu/opencloud-rolling:latest
          command: ["opencloud", "server"]
          ports:
            - containerPort: 9200
              name: http
          envFrom:
            - configMapRef:
                name: opencloud-config
            - secretRef:
                name: opencloud-secret
          env:
            - name: PROXY_TLS
              value: "false"
            - name: OC_INSECURE
              value: "true"
            - name: PROXY_HTTP_ADDR
              value: "0.0.0.0:9200"
          volumeMounts:
            - name: config
              mountPath: /etc/opencloud
            - name: tank
              mountPath: /var/lib/opencloud
          livenessProbe:
            httpGet:
              path: /health
              port: 9200
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 9200
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: opencloud-config
        - name: tank
          persistentVolumeClaim:
            claimName: opencloud-tank
---
apiVersion: v1
kind: Service
metadata:
  name: opencloud
  namespace: opencloud
spec:
  selector:
    app: opencloud
  type: ClusterIP
  ports:
    - name: http
      port: 9200
      targetPort: 9200
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencloud
  namespace: opencloud
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - opencloud.jtanprojects.com
  rules:
    - backendRefs:
        - name: opencloud
          port: 9200
