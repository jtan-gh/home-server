apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-proxy
  namespace: opencloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-proxy
  template:
    metadata:
      labels:
        app: nginx-proxy
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
          hostPort: 80
        - containerPort: 443
          hostPort: 443
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf   # mount as a file, not a directory
        - name: tls
          mountPath: /etc/nginx/ssl
          readOnly: true
      volumes:
      - name: nginx-conf
        configMap:
          name: nginx-conf
      - name: tls
        secret:
          secretName: opencloud-tls
