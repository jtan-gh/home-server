apiVersion: v1
kind: Service
metadata:
  name: pihole
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.20
spec:
  type: LoadBalancer
  selector:
    app: pihole
  ports:
    - name: dns-tcp
      protocol: TCP
      port: 53
      targetPort: 53
    - name: dns-udp
      protocol: UDP
      port: 53
      targetPort: 53
    - name: web-ui
      protocol: TCP
      port: 8080      # External port
      targetPort: 80  # Internal Pi-hole port
