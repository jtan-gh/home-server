apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  labels:
    app: pihole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      # ----------------------------
      # Init container sets the password from the Secret
      # ----------------------------
      initContainers:
        - name: set-pihole-password
          image: pihole/pihole:latest
          env:
            - name: WEBPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pihole-secret
                  key: webpassword
          command:
            - /bin/bash
            - -c
          args:
            - |
              if [ -f /etc/pihole/setupVars.conf ]; then
                echo "Password config exists, overwriting..."
              fi
              # Pi-hole expects single quotes around password for non-interactive set
              pihole -a -p "'$WEBPASSWORD'" || true
          volumeMounts:
            - name: pihole-storage
              mountPath: /etc/pihole

      # ----------------------------
      # Main Pi-hole container
      # ----------------------------
      containers:
        - name: pihole
          image: pihole/pihole:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: "America/Vancouver"
            - name: WEBPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pihole-secret
                  key: webpassword
            - name: DNSMASQ_LISTENING
              value: "all"
            - name: FTLCONF_LOCAL_IPV4
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PIHOLE_DNS_
              value: "8.8.8.8;8.8.4.4"
          ports:
            - containerPort: 53
              protocol: UDP
            - containerPort: 53
              protocol: TCP
            - containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: pihole-storage
              mountPath: /etc/pihole

      # ----------------------------
      # Persistent storage
      # ----------------------------
      volumes:
        - name: pihole-storage
          persistentVolumeClaim:
            claimName: pihole-pvc
